<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Dear Corner — Little Things, Lovely Spaces.</title>
    <meta
      name="description"
      content="Aesthetic room decor, lamps and lighting, desk and stationery, accessories and gifts, delivered across Bangladesh. Cash on Delivery."
    />
    <meta name="theme-color" content="#FBF7F1" />
    <link rel="canonical" href="__SITE_URL__/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Homepage only: start downloading the hero photo before the app runs
      // (it is the Largest Contentful Paint). Same photo the page will pick:
      // the one cached from the last visit, otherwise the built-in default.
      // Keep in step with services/home.ts and lib/images.ts.
      (function () {
        if (location.pathname !== "/") return;
        var desktop = "/samples/home/hero-desktop.webp";
        var mobile = "/samples/home/hero-mobile.webp";
        try {
          var cached = JSON.parse(
            localStorage.getItem("dc-cache:shop-settings") || "null",
          );
          var hero = cached && cached.homepage && cached.homepage.hero;
          if (hero && typeof hero === "object") {
            if ("image_desktop" in hero) desktop = hero.image_desktop;
            if ("image_mobile" in hero) mobile = hero.image_mobile;
          }
        } catch (e) {}
        var base = "%VITE_SUPABASE_URL%";
        function url(path) {
          if (!path || typeof path !== "string") return null;
          if (/^(https?:)?\/\//.test(path) || path.charAt(0) === "/")
            return path;
          if (base.charAt(0) === "%") return null;
          return base + "/storage/v1/object/public/site-media/" + path;
        }
        function preload(href, media) {
          if (!href) return;
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          link.media = media;
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        }
        var d = url(desktop);
        preload(url(mobile) || d, "(max-width: 767.98px)");
        preload(d, "(min-width: 768px)");
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dear Corner" />
    <meta
      property="og:title"
      content="Dear Corner — Little Things, Lovely Spaces."
    />
    <meta
      property="og:description"
      content="Room decor, lamps, desk picks and gifts, chosen with care. Cash on Delivery across Bangladesh."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dear Corner logo on warm linen" />
    <meta property="og:locale" content="en_BD" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dear Corner — Little Things, Lovely Spaces."
    />
    <meta
      name="twitter:description"
      content="Room decor, lamps, desk picks and gifts, chosen with care. Cash on Delivery across Bangladesh."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <style>
      /* Paint the brand background before CSS arrives: never a blank white screen. */
      html,
      body {
        background: #fbf7f1;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>

        Dear Corner needs JavaScript to show the shop. Please turn it on and

    <script type="module" src="/src/main.tsx"></script>
  </body>
